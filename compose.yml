services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nabeeh
      POSTGRES_USER: nabeeh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabeeh -d nabeeh"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://nabeeh:${POSTGRES_PASSWORD}@db:5432/nabeeh
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      COOKIE_SECURE: "true"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    command: ["node", "--import", "tsx", "scripts/start.ts"]
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://nabeeh:${POSTGRES_PASSWORD}@db:5432/nabeeh
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      GENERATION_DAILY_BUDGET_CENTS: ${GENERATION_DAILY_BUDGET_CENTS:-200}
    depends_on:
      app: { condition: service_healthy }
    command: ["node", "--import", "tsx", "server/worker.ts"]
volumes:
  postgres-data:
